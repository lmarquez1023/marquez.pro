<html lang="en">
<head>
<meta charset="UTF-8"/>

<title>Fundraising Metrics Dashboard | The Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --navy:#0E1729; --navy2:#16213B; --gold:#D6A34C; --gold-hi:#E9C583;
  --berry:#8C2F39; --slate:#9AA3B8; --slate2:#919CB8; --paper:#F2EFE6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Public Sans",-apple-system,sans-serif;background:var(--paper);color:var(--navy);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Public Sans",-apple-system,sans-serif;font-weight:700}
.mono{font-family:"IBM Plex Mono",monospace}

/* ---------- site nav (matches Vault tool pages) ---------- */
.site-nav{position:sticky;top:0;z-index:50;background:var(--navy);border-bottom:1px solid rgba(214,163,76,0.25);
  display:flex;align-items:center;justify-content:space-between;padding:14px 28px;flex-wrap:wrap;gap:10px}
.site-nav .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--paper)}
.site-nav .brand .mark{font-family:"Public Sans",sans-serif;font-weight:700;font-size:16px;color:var(--gold)}
.site-nav .brand .sub{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--slate)}
.site-nav .links{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.site-nav .links a{font-size:13px;color:var(--slate2);text-decoration:none;padding:6px 2px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.site-nav .links a:hover{color:var(--paper)}
.site-nav .links a.current{color:var(--gold);border-color:var(--gold);font-weight:600}
@media(max-width:720px){.site-nav .links{display:none}}

/* ---------- hero ---------- */
.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:var(--paper);padding:52px 28px 44px;text-align:center}
.hero-eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:16px;font-weight:600}
.hero h1{font-size:34px;font-weight:600;margin-bottom:14px;letter-spacing:-0.3px}
.hero p{font-size:15px;color:var(--slate2);max-width:560px;margin:0 auto;line-height:1.7}

/* ---------- layout ---------- */
.wrap{max-width:920px;margin:0 auto;padding:40px 24px 60px}
.sec-title{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--berry);margin-bottom:14px}
.card{background:#fff;border:1px solid rgba(14,23,41,0.1);border-radius:14px;padding:26px 28px;margin-bottom:16px;box-shadow:0 1px 3px rgba(14,23,41,0.05)}

/* ---------- instructions ---------- */
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.field-item{padding:14px 16px;background:var(--paper);border-radius:10px;border:1px solid rgba(14,23,41,0.08)}
.field-name{font-size:14px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:6px}
.req{color:var(--berry);font-size:12px;font-weight:700}
.opt{color:var(--slate);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field-desc{font-size:12.5px;color:#4b5568;margin-top:5px;line-height:1.55}
.field-ex{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--slate);margin-top:6px}

.hint{background:#FBF3E4;color:#7D4A0F;padding:13px 16px;border-radius:10px;font-size:13px;border:1px solid #F0D9A8;line-height:1.6;margin-top:14px}
.err{background:#FBE7E9;color:#7A2430;padding:13px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;border:1px solid #EFC1C7}

/* ---------- buttons ---------- */
.btn-navy{background:var(--navy);color:var(--paper);border:none;border-radius:9px;padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;font-family:"Public Sans",sans-serif}
.btn-navy:hover{background:var(--navy2)}
.btn-navy:disabled{background:#b7bdc9;cursor:not-allowed}
.btn-gold{background:var(--gold);color:var(--navy);border:none;border-radius:9px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;font-family:"Public Sans",sans-serif}
.btn-gold:hover{background:var(--gold-hi)}
.btn-outline{background:none;border:1.5px solid rgba(14,23,41,0.18);border-radius:9px;padding:10px 18px;font-size:13px;color:var(--navy);cursor:pointer;font-weight:600;font-family:"Public Sans",sans-serif}
.btn-outline:hover{background:rgba(14,23,41,0.05)}
.btn-outline-lt{background:none;border:1.5px solid rgba(242,239,230,0.35);border-radius:9px;padding:10px 18px;font-size:13px;color:var(--paper);cursor:pointer;font-weight:600}
.btn-outline-lt:hover{background:rgba(242,239,230,0.1)}
.action-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}

/* ---------- upload ---------- */
.drop-zone{border:2px dashed rgba(14,23,41,0.22);border-radius:14px;padding:38px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;margin-top:8px}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--gold);background:#FDF8EE}
.drop-zone .icon{font-size:30px;margin-bottom:8px}
.drop-zone p{font-size:14px;color:#4b5568;margin-top:6px}
.drop-zone .sub{font-size:12px;color:var(--slate);margin-top:4px}
.file-chip{display:inline-flex;align-items:center;gap:10px;background:var(--paper);border:1px solid rgba(14,23,41,0.1);border-radius:9px;padding:8px 14px;font-size:13px;margin-top:10px}
.file-chip button{background:none;border:none;color:var(--berry);cursor:pointer;font-size:13px;font-weight:600}

/* ---------- topbar (results) ---------- */
.topbar{background:var(--navy);color:var(--paper);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.topbar-left p{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.topbar-left h2{font-size:19px;font-weight:600;margin-top:4px}
.topbar-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- metrics ---------- */
.hero-metric{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:var(--paper);border-radius:16px;padding:34px 32px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:22px}
.hero-metric-label{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.hero-metric-value{font-family:"Public Sans",sans-serif;font-size:56px;font-weight:800;line-height:1}
.hero-metric-sub{font-size:13px;color:var(--slate2);margin-top:10px;max-width:420px;line-height:1.6}
.benchmark-pill{display:inline-block;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(214,163,76,0.15);color:var(--gold-hi);border:1px solid rgba(214,163,76,0.35);margin-top:14px}

.metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.metric{background:#fff;border:1px solid rgba(14,23,41,0.1);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(14,23,41,0.04)}
.metric-label{font-size:11.5px;color:#6b7280;margin-bottom:6px;line-height:1.4}
.metric-value{font-family:"Public Sans",sans-serif;font-size:24px;font-weight:700;color:var(--navy)}
.metric-info{font-size:10.5px;color:var(--slate);margin-top:5px;line-height:1.5}

.info-box{background:#fff;border:1px solid rgba(14,23,41,0.1);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:16px 20px;margin-bottom:20px}
.info-box .lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--berry);margin-bottom:6px;font-weight:600}
.info-box p{font-size:13px;color:#374151;line-height:1.65}
.info-box .formula{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--paper);padding:8px 12px;border-radius:6px;margin-top:8px;display:inline-block}

.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:20px}
.metric-card{background:#fff;border:1px solid rgba(14,23,41,0.1);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:20px 22px}
.metric-card.berry{border-left-color:var(--berry)}
.metric-card .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--berry);font-weight:600;margin-bottom:8px}
.metric-card .value{font-family:"Public Sans",sans-serif;font-size:32px;font-weight:800;color:var(--navy);line-height:1}
.metric-card .value.na{font-size:20px;color:var(--slate)}
.metric-card .desc{font-size:12.5px;color:#4b5568;margin-top:8px;line-height:1.55}
.metric-card .context{font-size:11.5px;color:var(--slate);margin-top:8px;font-style:italic}
.metric-card .formula{font-family:"IBM Plex Mono",monospace;font-size:10.5px;background:var(--paper);padding:5px 9px;border-radius:5px;margin-top:10px;display:inline-block;color:#4b5568}
.note-row{font-size:12px;color:var(--slate);margin:-6px 0 20px;line-height:1.6}

.tbl-wrap{background:#fff;border:1px solid rgba(14,23,41,0.1);border-radius:14px;overflow:hidden;margin-bottom:20px;box-shadow:0 1px 3px rgba(14,23,41,0.05)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--navy);color:var(--paper)}
thead th{padding:11px 16px;text-align:left;font-weight:600;font-size:11.5px;font-family:"IBM Plex Mono",monospace;letter-spacing:.5px;text-transform:uppercase}
thead th.r{text-align:right}
tbody tr{border-bottom:1px solid #f0f0ee}
tbody tr:last-child{border-bottom:none}
tbody tr:nth-child(even){background:#FAFAF7}
td{padding:10px 16px;vertical-align:middle}
td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl-empty{padding:24px;text-align:center;color:var(--slate);font-size:13px}

/* ---------- form controls ---------- */
select,input[type=text],input[type=date]{width:100%;padding:10px 12px;border:1px solid rgba(14,23,41,0.18);border-radius:8px;font-size:14px;font-family:inherit;color:var(--navy);background:white}
select:focus,input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(214,163,76,0.2)}
label.field-label{font-size:12px;font-weight:600;color:#4b5568;margin-bottom:6px;display:block}
.period-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.toggle-row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:#4b5568;cursor:pointer}
.range-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

.step-back{background:none;border:none;color:var(--berry);font-size:13px;cursor:pointer;padding:0;margin-bottom:18px;display:flex;align-items:center;gap:5px;font-weight:600}
.footer-note{font-size:12px;color:var(--slate);text-align:center;padding:26px 0 10px;border-top:1px solid rgba(14,23,41,0.08);margin-top:10px;line-height:1.8}
.report-label-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.report-label-row input{max-width:360px}

@media(max-width:680px){
  .metrics-row{grid-template-columns:1fr 1fr}
  .period-grid,.range-grid{grid-template-columns:1fr}
  .field-grid{grid-template-columns:1fr}
  .hero h1{font-size:26px}
  .hero-metric-value{font-size:42px}
  .metrics-grid{grid-template-columns:1fr}
}

/* ---------- print ---------- */
@media print{
  .no-print{display:none!important}
  body{background:#fff}
  .wrap{padding:0;max-width:100%}
  .card{box-shadow:none;border:1px solid #ddd}
  .hero-metric{background:var(--navy)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  thead tr{background:var(--navy)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .metrics-row{grid-template-columns:repeat(4,1fr)}
  .metrics-grid{grid-template-columns:repeat(2,1fr)}
  .metric-card{break-inside:avoid}
  .tbl-wrap{break-inside:avoid}
}

<div id="app"></div>

<script>
const APP_EL = document.getElementById('app');

const state = {
  step: 'intro',              // intro -> periods -> results
  fileName: '',
  rows: [],                   // {donorId, donorName, date, amount}
  years: [],
  priorYear: null,
  currentYear: null,
  customRange: false,
  priorStart: '', priorEnd: '',
  currentStart: '', currentEnd: '',
  reportLabel: '',
  error: '',
  dragOver: false,
};

function setState(patch){ Object.assign(state, patch); render(); }

/* ---------------- template download ---------------- */
function sampleRows(){
  // Three giving years so every metric — including Recapture Rate and
  // First-Time Donor Retention, which need history before the baseline period — has real data to show.
  const y0 = 2024, priorY = 2025, curY = 2026;
  const rows = [];
  let id = 1000;
  const gift = (donorId, name, y, month, day, amt) => rows.push({
    "Donor ID": donorId, "Donor Name": name,
    "Gift Date": `${String(month).padStart(2,'0')}/${String(day).padStart(2,'0')}/${y}`,
    "Gift Amount": amt
  });

  // A) Core retained — gave all three years
  ["Maria Alvarez","James Whitfield","Sofia Reyes","Robert Chen","Linda Okafor","David Patel","Grace Kim","Thomas Nguyen"]
    .forEach((name,i)=>{
      const donorId = "D" + (id++);
      gift(donorId,name,y0,3,(i%27)+1, 60+i*30);
      gift(donorId,name,priorY,3,(i%27)+1, 65+i*32);
      gift(donorId,name,curY,3,(i%27)+1, 70+i*35);
    });

  // B) Recaptured — gave y0, skipped priorY, came back curY
  ["Patricia Flores","Michael Sato","Angela Brooks","Carlos Mendoza"].forEach((name,i)=>{
    const donorId = "D" + (id++);
    gift(donorId,name,y0,4,(i%27)+1, 100+i*40);
    gift(donorId,name,curY,7,(i%27)+1, 90+i*45);
  });

  // C) Still lapsed — gave y0 only, nothing since
  ["Rachel Osei","Daniel Cruz","Helen Ivanova","Anthony Ruiz","Barbara Long"].forEach((name,i)=>{
    const donorId = "D" + (id++);
    gift(donorId,name,y0,5,(i%27)+1, 80+i*25);
  });

  // D) Lapsed from the prior→current view — gave priorY only, not curY
  ["Kevin O'Neal","Teresa Diallo","Steven Park","Wendy Sharma"].forEach((name,i)=>{
    const donorId = "D" + (id++);
    gift(donorId,name,priorY,6,(i%27)+1, 55+i*33);
  });

  // E) First-time in prior period, converted to a 2nd gift in current period
  ["Marcus Ellery","Diane Kowalski","Isabel Torres"].forEach((name,i)=>{
    const donorId = "D" + (id++);
    gift(donorId,name,priorY,9,(i%27)+1, 45+i*20);
    gift(donorId,name,curY,9,(i%27)+1, 50+i*22);
  });

  // F) First-time in prior period, did not convert
  ["Oscar Delgado","Priya Nair"].forEach((name,i)=>{
    const donorId = "D" + (id++);
    gift(donorId,name,priorY,10,(i%27)+1, 40+i*18);
  });

  // G) Brand new in the current period (true first-time donors)
  ["Nina Kowalczyk","Samuel Boakye","Elena Petrova","Miguel Santos"].forEach((name,i)=>{
    const donorId = "D" + (id++);
    gift(donorId,name,curY,8,(i%27)+3, 75+i*30);
  });

  return rows;
}

function downloadTemplate(){
  const rows = sampleRows();
  const headers = ["Donor ID","Donor Name","Gift Date","Gift Amount"];
  const lines = [headers.join(",")];
  rows.forEach(r=>{
    lines.push(headers.map(h=>{
      const v = r[h];
      return (typeof v === "string" && v.includes(",")) ? `"${v}"` : v;
    }).join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "retention_rate_data_template.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------- file parsing ---------------- */
function findColumn(headers, patterns){
  for (const p of patterns){
    const hit = headers.find(h => p.test(String(h).trim()));
    if (hit) return hit;
  }
  return null;
}

function parseAmount(v){
  if (typeof v === "number") return v;
  if (!v) return NaN;
  const cleaned = String(v).replace(/[$,]/g,"").trim();
  return parseFloat(cleaned);
}

function parseDateVal(v){
  if (v instanceof Date && !isNaN(v)) return v;
  if (typeof v === "string"){
    const d = new Date(v);
    if (!isNaN(d)) return d;
  }
  return null;
}

function handleFile(file){
  setState({error:''});
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:"array", cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, {defval:""});
      if (!json.length){ setState({error:"That file doesn't seem to contain any rows. Check that data starts in row 1 with headers."}); return; }

      const headers = Object.keys(json[0]);
      const idCol = findColumn(headers, [/donor.?id/i,/constituent.?id/i,/account.?id/i,/household.?id/i,/^id$/i]);
      const dateCol = findColumn(headers, [/gift.?date/i,/transaction.?date/i,/^date$/i]);
      const amtCol = findColumn(headers, [/gift.?amount/i,/^amount$/i,/^amt$/i]);
      const nameCol = findColumn(headers, [/donor.?name/i,/^name$/i,/constituent.?name/i]);

      const missing = [];
      if (!idCol) missing.push("Donor ID");
      if (!dateCol) missing.push("Gift Date");
      if (!amtCol) missing.push("Gift Amount");
      if (missing.length){
        setState({error:`Couldn't find a column for: ${missing.join(", ")}. Rename your columns to match the template, or download the template below for the expected format.`});
        return;
      }

      const rows = [];
      let skipped = 0;
      json.forEach(r=>{
        const donorId = String(r[idCol]).trim();
        const date = parseDateVal(r[dateCol]);
        const amount = parseAmount(r[amtCol]);
        if (!donorId || !date || isNaN(amount)) { skipped++; return; }
        rows.push({ donorId, donorName: nameCol ? String(r[nameCol]).trim() : donorId, date, amount });
      });

      if (!rows.length){ setState({error:"None of the rows had a valid Donor ID, Gift Date, and Gift Amount together. Double-check the data and try again."}); return; }

      const years = Array.from(new Set(rows.map(r=>r.date.getFullYear()))).sort((a,b)=>b-a);
      if (years.length < 2){
        setState({error:"This file only contains giving from a single year. Retention rate compares two periods — include at least two years (or two fiscal periods) of gift history."});
        return;
      }

      setState({
        rows, years, fileName: file.name,
        currentYear: years[0], priorYear: years[1],
        step: 'periods', error: skipped ? `Loaded ${rows.length} gift rows (${skipped} rows were skipped for missing/invalid data).` : ''
      });
    }catch(err){
      setState({error:"Couldn't read that file. Make sure it's a CSV or Excel (.xlsx) export and try again."});
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------------- retention calculation ---------------- */
function periodRange(mode){
  if (state.customRange){
    return {
      prior: [new Date(state.priorStart), new Date(state.priorEnd)],
      current: [new Date(state.currentStart), new Date(state.currentEnd)],
    };
  }
  return {
    prior: [new Date(state.priorYear,0,1), new Date(state.priorYear,11,31,23,59,59)],
    current: [new Date(state.currentYear,0,1), new Date(state.currentYear,11,31,23,59,59)],
  };
}

function inRange(d, range){ return d >= range[0] && d <= range[1]; }

function analyze(){
  const { prior, current } = periodRange();
  const priorDonors = new Map();     // donorId -> {name, total, count}
  const currentDonors = new Map();
  const firstGiftDate = new Map();   // donorId -> earliest gift date across ALL history in the file
  const hadGiftBefore = new Set();   // donorId -> gave at least once before the prior period started

  state.rows.forEach(r=>{
    const existingFirst = firstGiftDate.get(r.donorId);
    if (!existingFirst || r.date < existingFirst) firstGiftDate.set(r.donorId, r.date);

    if (r.date < prior[0]) hadGiftBefore.add(r.donorId);

    if (inRange(r.date, prior)){
      const e = priorDonors.get(r.donorId) || {name:r.donorName, total:0, count:0};
      e.total += r.amount; e.count += 1; priorDonors.set(r.donorId, e);
    }
    if (inRange(r.date, current)){
      const e = currentDonors.get(r.donorId) || {name:r.donorName, total:0, count:0};
      e.total += r.amount; e.count += 1; currentDonors.set(r.donorId, e);
    }
  });

  const priorIds = new Set(priorDonors.keys());
  const currentIds = new Set(currentDonors.keys());
  const retainedIds = [...priorIds].filter(id => currentIds.has(id));
  const lapsedIds = [...priorIds].filter(id => !currentIds.has(id));

  const priorDollars = [...priorDonors.values()].reduce((s,v)=>s+v.total,0);
  const currentDollars = [...currentDonors.values()].reduce((s,v)=>s+v.total,0);
  const priorGiftCount = [...priorDonors.values()].reduce((s,v)=>s+v.count,0);
  const currentGiftCount = [...currentDonors.values()].reduce((s,v)=>s+v.count,0);
  const retainedDollarsCurrent = retainedIds.reduce((s,id)=>s+currentDonors.get(id).total,0);

  // Retention / Renewal (same calc)
  const donorRetentionRate = priorIds.size ? (retainedIds.length / priorIds.size) * 100 : 0;
  const dollarRetentionRate = priorDollars ? (retainedDollarsCurrent / priorDollars) * 100 : 0;

  // Average gift size
  const avgGiftPrior = priorGiftCount ? priorDollars / priorGiftCount : 0;
  const avgGiftCurrent = currentGiftCount ? currentDollars / currentGiftCount : 0;
  const avgGiftPctChange = avgGiftPrior ? ((avgGiftCurrent - avgGiftPrior) / avgGiftPrior) * 100 : 0;
  const avgPerDonorPrior = priorIds.size ? priorDollars / priorIds.size : 0;
  const avgPerDonorCurrent = currentIds.size ? currentDollars / currentIds.size : 0;

  // New donor acquisition — true first-time donors (first gift ever falls in current period)
  const trueNewIds = [...currentIds].filter(id => {
    const fd = firstGiftDate.get(id);
    return fd && inRange(fd, current);
  });
  const acquisitionRate = currentIds.size ? (trueNewIds.length / currentIds.size) * 100 : 0;

  // Recapture rate — donors who had given before the prior period, went quiet during
  // the prior period, then gave again in the current period
  const lapsedPoolIds = [...hadGiftBefore].filter(id => !priorIds.has(id));
  const recapturedIds = lapsedPoolIds.filter(id => currentIds.has(id));
  const recaptureRate = lapsedPoolIds.length ? (recapturedIds.length / lapsedPoolIds.length) * 100 : null;

  // First-time donor retention — first gift ever fell in the prior period; did they give again?
  const firstTimeInPriorIds = [...priorIds].filter(id => {
    const fd = firstGiftDate.get(id);
    return fd && inRange(fd, prior);
  });
  const convertedIds = firstTimeInPriorIds.filter(id => currentIds.has(id));
  const firstTimeRetentionRate = firstTimeInPriorIds.length ? (convertedIds.length / firstTimeInPriorIds.length) * 100 : null;

  const lapsedList = lapsedIds.map(id => ({ id, name: priorDonors.get(id).name, total: priorDonors.get(id).total }))
    .sort((a,b)=>b.total-a.total);
  const newDonorList = trueNewIds.map(id => ({ id, name: currentDonors.get(id).name, total: currentDonors.get(id).total }))
    .sort((a,b)=>b.total-a.total);

  return {
    priorCount: priorIds.size, currentCount: currentIds.size,
    retainedCount: retainedIds.length, newCount: trueNewIds.length, lapsedCount: lapsedIds.length,
    donorRetentionRate, dollarRetentionRate, priorDollars, retainedDollarsCurrent,
    avgGiftPrior, avgGiftCurrent, avgGiftPctChange, avgPerDonorPrior, avgPerDonorCurrent,
    acquisitionRate, trueNewCount: trueNewIds.length,
    recaptureRate, lapsedPoolCount: lapsedPoolIds.length, recapturedCount: recapturedIds.length,
    firstTimeRetentionRate, firstTimeInPriorCount: firstTimeInPriorIds.length, convertedCount: convertedIds.length,
    lapsedList, newDonorList
  };
}

const fmt = n => "$" + Math.round(n).toLocaleString("en-US");
const pct = n => n.toFixed(1) + "%";

}

function periodError(){
  if (!state.customRange){
    if (state.priorYear === state.currentYear) return "Prior and current period can't be the same year.";
    if (state.priorYear > state.currentYear) return "Prior period should be the earlier year — swap the two selections.";
    return null;
  }
  if (!state.priorStart || !state.priorEnd || !state.currentStart || !state.currentEnd) return "Fill in all four dates to continue.";
  const ps = new Date(state.priorStart), pe = new Date(state.priorEnd), cs = new Date(state.currentStart), ce = new Date(state.currentEnd);
  if (ps > pe) return "The prior period's start date is after its end date.";
  if (cs > ce) return "The current period's start date is after its end date.";
  if (ps > cs) return "The prior period should start before the current period — check your dates.";
  return null;
}

        <div class="benchmark-pill">${benchmarkNote}</div>
      </div>
    </div>

    <div class="sec-title">What's behind the number</div>
    <div class="metrics-row">
      <div class="metric">
        <div class="metric-label">Prior-period donors</div>
        <div class="metric-value">${d.priorCount}</div>
        <div class="metric-info">Unique donors who gave in ${state.customRange?'the prior period':state.priorYear}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Retained donors</div>
        <div class="metric-value">${d.retainedCount}</div>
        <div class="metric-info">Gave in both periods</div>
      </div>
      <div class="metric">
        <div class="metric-label">Lapsed donors</div>
        <div class="metric-value">${d.lapsedCount}</div>
        <div class="metric-info">Gave prior period only — did not give again</div>
      </div>
      <div class="metric">
        <div class="metric-label">New donors</div>
        <div class="metric-value">${d.newCount}</div>
        <div class="metric-info">Gave in the current period only</div>
      </div>
    </div>

    <div class="info-box">
      <div class="lbl">Related metric &nbsp;·&nbsp; Dollar Retention Rate</div>
      <p>Retained donors' current-period giving as a share of what the prior-period pool gave. Unlike donor retention, this can exceed 100% if retained donors gave more this period than last.</p>
      <div class="formula">${fmt(d.retainedDollarsCurrent)} ÷ ${fmt(d.priorDollars)} = ${pct(d.dollarRetentionRate)}</div>
    </div>

    <div class="sec-title">More metrics from the same file</div>
    <div class="metrics-grid">
      <div class="metric-card berry">
        <div class="eyebrow">Renewal Rate</div>
        <div class="value">${pct(d.donorRetentionRate)}</div>
        <div class="desc">Same calculation as Retention Rate above — shown here under the name some funds or teams use instead.</div>
        <div class="formula">${d.retainedCount} ÷ ${d.priorCount} × 100</div>

      <div class="metric-card">

        <div class="value">${fmt(d.avgGiftCurrent)}</div>

      </div>

        </tbody>
      </table>` : `<div class="tbl-empty">No lapsed donors — every prior-period donor gave again.</div>`}
    </div>
    ${d.lapsedList.length>25 ? `<p style="font-size:12px;color:var(--slate);margin-top:-10px;margin-bottom:20px">Showing top 25 of ${d.lapsedList.length} lapsed donors by prior-period giving.</p>`:''}

    <div class="sec-title">New donors — highest first gift value</div>
    <div class="tbl-wrap">
      ${d.newDonorList.length ? `
      <table>
        <thead><tr><th>Donor</th><th class="r">Gave in ${state.customRange?'current period':state.currentYear}</th></tr></thead>
        <tbody>
          ${d.newDonorList.slice(0,25).map(n=>`<tr><td>${n.name}</td><td class="r">${fmt(n.total)}</td></tr>`).join("")}
        </tbody>
      </table>` : `<div class="tbl-empty">No brand-new donors this period.</div>`}
    </div>
    ${d.newDonorList.length>25 ? `<p style="font-size:12px;color:var(--slate);margin-top:-10px;margin-bottom:20px">Showing top 25 of ${d.newDonorList.length} new donors by first-gift value.</p>`:''}

    <div class="footer-note no-print">
      All data processed locally in your browser. Nothing leaves your machine.<br>
      Use "Export as PDF" and choose "Save as PDF" in the print dialog to save or share this report.
    </div>
  </div>`;
}

/* ---------------- events ---------------- */
function onFileInput(e){
  const f = e.target.files[0];
  if (f) handleFile(f);
}

function wireDropZone(){
  const dz = document.getElementById('dz');
  if (!dz) return;
  dz.addEventListener('dragover', e=>{ e.preventDefault(); setState({dragOver:true}); });
  dz.addEventListener('dragleave', ()=> setState({dragOver:false}));
  dz.addEventListener('drop', e=>{
    e.preventDefault(); setState({dragOver:false});
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
}

render();
