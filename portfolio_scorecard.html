<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
(function(){

  const SCHEMA_VERSION = 3;

  // ---------- utilities ----------
  function parseAmount(s){
    if(s==null) return 0;
    const n = parseFloat(String(s).replace(/[^0-9.\-]/g,''));
    return isNaN(n) ? 0 : n;
  }
  function parseDateStr(s){
    if(!s) return null;
    const parts = String(s).trim().split(/[\/\-]/);
    if(parts.length!==3) return null;
    let [m,d,y] = parts;
    m=parseInt(m,10); d=parseInt(d,10); y=parseInt(y,10);
    if(y<100) y+=2000;
    const dt = new Date(y, m-1, d);
    return isNaN(dt.getTime()) ? null : dt;
  }
  function fmtDate(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
  function fmtMoney(n){
    if(n===null||n===undefined||!isFinite(n)) return '—';
    if(Math.abs(n)>=1000000) return '$'+(n/1000000).toFixed(2)+'M';
    return '$'+Math.round(n).toLocaleString('en-US');
  }
  function fmtMoneyFull(n){
    if(n===null||n===undefined||!isFinite(n)) return '—';
    return '$'+Math.round(n).toLocaleString('en-US');
  }
  function fmtPct(n){ if(n===null||n===undefined||!isFinite(n)) return '—'; return (n*100).toFixed(1)+'%'; }
  function fmtNum(n){ return Math.round(n).toLocaleString('en-US'); }
  function fiscalYear(date){ const m=date.getMonth()+1; return m>=7 ? date.getFullYear()+1 : date.getFullYear(); }
  function fyStart(fy){ return new Date(fy-1,6,1); }
  function addDays(date,days){ const d=new Date(date); d.setDate(d.getDate()+days); return d; }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }
  function median(arr){
    if(!arr.length) return 0;
    const s=[...arr].sort((a,b)=>a-b);
    const mid=Math.floor(s.length/2);
    return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  }
  function csvParse(file){
    return new Promise((resolve,reject)=>{
      Papa.parse(file,{ header:true, skipEmptyLines:true,
        complete:(res)=>resolve(res.data),
        error:(err)=>reject(err) });
    });
  }
  function slug(s){ return s.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

  // ---------- state ----------
  let portfolios = [];         // [{id, name}]
  let currentPortfolioId = null;
  let snapshots = [];          // [{periodKey, asOf, data}] sorted asc by asOf
  let selectedIndex = -1;
  let pendingRosterRows = null;
  let pendingGiftRows = null;

  const $ = (id)=>document.getElementById(id);

  // ---------- storage ----------
  async function loadPortfolios(){
    try{
      const r = await window.storage.get('portfolios', false);
      portfolios = r && r.value ? JSON.parse(r.value) : [];
    }catch(e){ portfolios = []; }
    if(portfolios.length===0){
      portfolios = [{id:'default', name:'My Portfolio'}];
      await savePortfolios();
    }
  }
  async function savePortfolios(){
    await window.storage.set('portfolios', JSON.stringify(portfolios), false);
  }
  async function loadSnapshotsFor(portfolioId){
    let keys = [];
    try{
      const r = await window.storage.list('snapshot:'+portfolioId+':', false);
      keys = r && r.keys ? r.keys : [];
    }catch(e){ keys = []; }
    const loaded = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, false);
        if(r && r.value) loaded.push(JSON.parse(r.value));
      }catch(e){}
    }
    loaded.sort((a,b)=> new Date(a.asOf) - new Date(b.asOf));
    return loaded;
  }
  async function saveSnapshot(portfolioId, snap){
    const key = 'snapshot:'+portfolioId+':'+snap.periodKey;
    await window.storage.set(key, JSON.stringify(snap), false);
  }
  async function deleteSnapshot(portfolioId, periodKey){
    const key = 'snapshot:'+portfolioId+':'+periodKey;
    try{ await window.storage.delete(key, false); }catch(e){}
  }

  // ---------- computation ----------
  function computeScorecard(rosterRows, giftRows, asOfDate){
    const roster = new Map();
    rosterRows.forEach(row=>{
      const id = (row['ID']||row['Donor ID']||row['Constituent ID']||'').trim();
      if(!id) return;
      roster.set(id, {
        last: (row['Last Name']||'').trim(),
        first: (row['First Name']||'').trim()
      });
    });
    const rosterSize = roster.size;

    const gifts = [];
    giftRows.forEach(row=>{
      const dt = parseDateStr(row['Gift Date']);
      if(!dt) return;
      const amt = parseAmount(row['Gift Amount']);
      const id = (row['Donor ID']||row['Constituent ID']||'').trim();
      if(!id) return;
      gifts.push({date:dt, amt, id, cat:(row['Fund Category']||'').trim()});
    });

    const currentFY = fiscalYear(asOfDate);
    const priorFY = currentFY - 1;
    const priorPriorFY = currentFY - 2;
    const fyStartCur = fyStart(currentFY);
    const fyStartPri = fyStart(priorFY);
    const fyStartPriPri = fyStart(priorPriorFY);
    const elapsedDays = daysBetween(fyStartCur, asOfDate);
    const priorFYTDCutoff = addDays(fyStartPri, elapsedDays);

    const donorStats = new Map();
    function getStat(id){
      if(!donorStats.has(id)) donorStats.set(id, {
        curFYTD:0, curFYTDCount:0, priorFYTD:0, priorFYFull:0, priorPriorFYFull:0, allTime:0, minDate:null, maxDate:null
      });
      return donorStats.get(id);
    }

    const catTotals = { prior:{}, priorPrior:{} };
    function addCat(bucket, cat, amt){
      const key = cat || 'Uncategorized';
      bucket[key] = (bucket[key]||0) + amt;
    }

    gifts.forEach(g=>{
      const s = getStat(g.id);
      s.allTime += g.amt;
      if(!s.minDate || g.date < s.minDate) s.minDate = g.date;
      if(!s.maxDate || g.date > s.maxDate) s.maxDate = g.date;
      if(g.date >= fyStartCur && g.date <= asOfDate){ s.curFYTD += g.amt; s.curFYTDCount += 1; }
      if(g.date >= fyStartPri && g.date <= priorFYTDCutoff){ s.priorFYTD += g.amt; }
      if(g.date >= fyStartPri && g.date < fyStartCur){ s.priorFYFull += g.amt; addCat(catTotals.prior, g.cat, g.amt); }
      if(g.date >= fyStartPriPri && g.date < fyStartPri){ s.priorPriorFYFull += g.amt; addCat(catTotals.priorPrior, g.cat, g.amt); }
    });

    let totalCurFYTD=0, totalPriorFYTD=0, totalPriorFYFull=0, totalPriorPriorFYFull=0, totalGiftsCurFYTD=0;
    let activeCur=0, activePriorFull=0, retainedCount=0, retainedRevenue=0;
    let increasedCount=0, increasedAmt=0;
    let newDonors=0, reactivated=0;
    let capacitySum=0, capacityActualSum=0;
    const ltvList = [];
    const topDonorsArr = [];
    const increasedArr = [];
    const reactivatedArr = [];

    donorStats.forEach((s,id)=>{
      totalCurFYTD += s.curFYTD;
      totalPriorFYTD += s.priorFYTD;
      totalPriorFYFull += s.priorFYFull;
      totalPriorPriorFYFull += s.priorPriorFYFull;
      totalGiftsCurFYTD += s.curFYTDCount;
      if(s.curFYTD>0) activeCur++;
      if(s.priorFYFull>0) activePriorFull++;
      if(s.curFYTD>0 && s.priorFYFull>0){ retainedCount++; retainedRevenue += s.curFYTD; }
      if(s.curFYTD>0 && s.priorFYTD>0 && s.curFYTD>s.priorFYTD){
        increasedCount++; increasedAmt += (s.curFYTD - s.priorFYTD);
        increasedArr.push({id, curFYTD:s.curFYTD, priorFYTD:s.priorFYTD, inc:s.curFYTD-s.priorFYTD});
      }
      if(s.curFYTD>0 && s.priorFYFull===0 && s.minDate && s.minDate < fyStartPri){
        reactivated++; reactivatedArr.push({id, curFYTD:s.curFYTD, lastGiftBefore:s.maxDate});
      }
      if(s.curFYTD>0 && s.minDate && s.minDate >= fyStartCur){ newDonors++; }
      const cap = Math.max(s.curFYTD, s.priorFYFull);
      if(cap>0){ capacitySum += cap; capacityActualSum += s.curFYTD; }
      if(rosterSize){ /* ltv computed below for all roster incl zero */ }
      if(s.curFYTD>0){ topDonorsArr.push({id, curFYTD:s.curFYTD, priorFYTD:s.priorFYTD, count:s.curFYTDCount}); }
    });

    // LTV across full roster (donors with no gifts count as 0)
    roster.forEach((info,id)=>{
      const s = donorStats.get(id);
      ltvList.push(s ? s.allTime : 0);
    });
    // include off-roster donors' LTV too? no — LTV is a roster-level metric.
    const avgLTV = ltvList.length ? ltvList.reduce((a,b)=>a+b,0)/ltvList.length : 0;
    const medianLTV = median(ltvList);

    topDonorsArr.sort((a,b)=>b.curFYTD-a.curFYTD);
    increasedArr.sort((a,b)=>b.inc-a.inc);
    reactivatedArr.sort((a,b)=>b.curFYTD-a.curFYTD);

    const allCats = Array.from(new Set([...Object.keys(catTotals.priorPrior), ...Object.keys(catTotals.prior)]));
    const catBreakdown = allCats.map(cat=>({
      category: cat,
      priorPrior: catTotals.priorPrior[cat]||0,
      prior: catTotals.prior[cat]||0
    })).sort((a,b)=> (b.prior+b.priorPrior) - (a.prior+a.priorPrior));

    function withName(id){
      const r = roster.get(id);
      return r ? (r.first+' '+r.last).trim() || ('Donor '+id) : 'Donor '+id+' (off-roster)';
    }

    return {
      schemaVersion: SCHEMA_VERSION,
      rosterSize,
      currentFY, priorFY, priorPriorFY,
      fyStartCur: fyStartCur.toISOString(), fyStartPri: fyStartPri.toISOString(),
      elapsedDays,
      totals:{
        curFYTD: totalCurFYTD, priorFYTD: totalPriorFYTD, priorFYFull: totalPriorFYFull,
        priorPriorFYFull: totalPriorPriorFYFull,
        giftsCurFYTD: totalGiftsCurFYTD,
        avgGift: totalGiftsCurFYTD ? totalCurFYTD/totalGiftsCurFYTD : 0,
        yoyPct: totalPriorFYTD>0 ? (totalCurFYTD-totalPriorFYTD)/totalPriorFYTD : null
      },
      donors:{
        activeCur, activePriorFull,
        participationRate: rosterSize ? activeCur/rosterSize : 0,
        retentionRate: activePriorFull ? retainedCount/activePriorFull : null,
        retainedCount,
        revenueRetention: totalPriorFYFull>0 ? retainedRevenue/totalPriorFYFull : null,
        increasedCount, increasedAmt,
        newDonors, reactivated
      },
      ltv:{ avg: avgLTV, median: medianLTV, n: ltvList.length },
      fyCategoryBreakdown: catBreakdown,
      capacity:{
        capacitySum, capacityActualSum,
        pct: capacitySum>0 ? capacityActualSum/capacitySum : null
      },
      topDonors: topDonorsArr.slice(0,10).map(d=>({name:withName(d.id), id:d.id, curFYTD:d.curFYTD, priorFYTD:d.priorFYTD, count:d.count})),
      increased: increasedArr.slice(0,10).map(d=>({name:withName(d.id), id:d.id, curFYTD:d.curFYTD, priorFYTD:d.priorFYTD, inc:d.inc})),
      returning: reactivatedArr.slice(0,10).map(d=>({name:withName(d.id), id:d.id, curFYTD:d.curFYTD}))
    };
  }

  // ---------- UI: portfolio select ----------
  function renderPortfolioSelect(){
    const sel = $('portfolioSelect');
    sel.innerHTML = '';
    portfolios.forEach(p=>{
      const opt = document.createElement('option');
      opt.value = p.id; opt.textContent = p.name;
      if(p.id===currentPortfolioId) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  async function switchPortfolio(id){
    currentPortfolioId = id;
    renderPortfolioSelect();
    snapshots = await loadSnapshotsFor(id);
    selectedIndex = snapshots.length - 1;
    renderSnapshotChips();
    renderDashboard();
  }

  function renderSnapshotChips(){
    const wrap = $('snapManage');
    wrap.innerHTML = '';
    if(snapshots.length===0) return;
    const label = document.createElement('span');
    label.className = 'footnote';
    label.style.marginRight = '4px';
    label.textContent = 'Saved snapshots:';
    wrap.appendChild(label);
    snapshots.forEach((s,i)=>{
      const chip = document.createElement('span');
      chip.className = 'snap-chip';
      const dt = new Date(s.asOf);
      chip.innerHTML = '<span>'+dt.toLocaleDateString('en-US',{month:'short',year:'numeric',day:'numeric'})+'</span>';
      const del = document.createElement('button');
      del.textContent = '✕';
      del.title = 'Delete this snapshot';
      del.onclick = async ()=>{
        const ok = await showConfirm('Delete the '+dt.toLocaleDateString()+' snapshot? This cannot be undone.');
        if(!ok) return;
        await deleteSnapshot(currentPortfolioId, s.periodKey);
        snapshots = await loadSnapshotsFor(currentPortfolioId);
        selectedIndex = snapshots.length-1;
        renderSnapshotChips();
        renderDashboard();
      };
      chip.appendChild(del);
      wrap.appendChild(chip);
    });
  }

  // ---------- UI: file inputs ----------
  $('rosterFile').addEventListener('change', async (e)=>{
    const f = e.target.files[0];
    $('rosterFileName').textContent = f ? f.name : 'No file selected';
    if(f){ pendingRosterRows = await csvParse(f); checkReady(); }
  });
  $('giftsFile').addEventListener('change', async (e)=>{
    const f = e.target.files[0];
    $('giftsFileName').textContent = f ? f.name : 'No file selected';
    if(f){
      pendingGiftRows = await csvParse(f);
      // auto-suggest as-of date = latest gift date found
      let maxDate = null;
      pendingGiftRows.forEach(row=>{
        const d = parseDateStr(row['Gift Date']);
        if(d && (!maxDate || d>maxDate)) maxDate = d;
      });
      if(maxDate && !$('asOfDate').value){
        $('asOfDate').value = maxDate.toISOString().slice(0,10);
      }
      checkReady();
    }
  });
  $('asOfDate').addEventListener('change', checkReady);

  function checkReady(){
    $('saveSnapshotBtn').disabled = !(pendingRosterRows && pendingGiftRows && $('asOfDate').value);
  }

  $('saveSnapshotBtn').addEventListener('click', async ()=>{
    const asOfVal = $('asOfDate').value;
    if(!asOfVal) return;
    const [y,m,d] = asOfVal.split('-').map(Number);
    const asOfDate = new Date(y, m-1, d);
    const statusEl = $('statusMsg');
    statusEl.className = 'status-msg info';
    statusEl.textContent = 'Computing scorecard…';
    try{
      const data = computeScorecard(pendingRosterRows, pendingGiftRows, asOfDate);
      const periodKey = asOfVal;
      const snap = { periodKey, asOf: asOfDate.toISOString(), data };
      await saveSnapshot(currentPortfolioId, snap);
      snapshots = await loadSnapshotsFor(currentPortfolioId);
      selectedIndex = snapshots.findIndex(s=>s.periodKey===periodKey);
      renderSnapshotChips();
      renderDashboard();
      statusEl.className = 'status-msg ok';
      statusEl.textContent = 'Snapshot saved for '+fmtDate(asOfDate)+'. Scroll down to view.';
      pendingRosterRows = null; pendingGiftRows = null;
      $('rosterFile').value = ''; $('giftsFile').value = '';
      $('rosterFileName').textContent = 'No file selected';
      $('giftsFileName').textContent = 'No file selected';
      $('saveSnapshotBtn').disabled = true;
    }catch(err){
      statusEl.className = 'status-msg err';
      statusEl.textContent = 'Something went wrong reading those files: '+err.message;
    }
  });

  function showConfirm(message){
    return new Promise((resolve)=>{
      const overlay = $('confirmOverlay');
      $('confirmMsg').textContent = message;
      overlay.style.display = 'flex';
      function cleanup(result){
        overlay.style.display = 'none';
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        resolve(result);
      }
      const okBtn = $('confirmOkBtn');
      const cancelBtn = $('confirmCancelBtn');
      function onOk(){ cleanup(true); }
      function onCancel(){ cleanup(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  }

  $('newPortfolioBtn').addEventListener('click', ()=>{
    $('newPortfolioForm').style.display = 'flex';
    $('newPortfolioInput').value = '';
    $('newPortfolioInput').focus();
  });
  $('addPortfolioCancel').addEventListener('click', ()=>{
    $('newPortfolioForm').style.display = 'none';
  });
  $('addPortfolioConfirm').addEventListener('click', async ()=>{
    await confirmAddPortfolio();
  });
  $('newPortfolioInput').addEventListener('keydown', async (e)=>{
    if(e.key==='Enter') await confirmAddPortfolio();
    if(e.key==='Escape') $('newPortfolioForm').style.display = 'none';
  });
  async function confirmAddPortfolio(){
    const name = $('newPortfolioInput').value.trim();
    if(!name) return;
    const id = slug(name) + '-' + Date.now().toString(36);
    portfolios.push({id, name});
    await savePortfolios();
    $('newPortfolioForm').style.display = 'none';
    await switchPortfolio(id);
  }

  $('portfolioSelect').addEventListener('change', (e)=> switchPortfolio(e.target.value));

  // ---------- dashboard rendering ----------
  function deltaSpan(pct){
    if(pct===null||pct===undefined||!isFinite(pct)) return '<span class="delta flat">vs. same point last FY: n/a</span>';
    const cls = pct>0.001 ? 'up' : (pct<-0.001 ? 'down' : 'flat');
    const arrow = pct>0.001 ? '▲' : (pct<-0.001 ? '▼' : '—');
    return '<span class="delta '+cls+'">'+arrow+' '+fmtPct(Math.abs(pct))+' vs. same point last FY</span>';
  }

  function renderDashboard(){
    const area = $('dashboardArea');
    const asofLine = $('asofLine');
    if(selectedIndex<0 || snapshots.length===0){
      asofLine.textContent = 'No snapshots yet for this portfolio — upload your roster and gifts CSVs above to create the first one.';
      area.innerHTML = '<div class="empty-state"><div class="glyph">◈</div>No snapshots yet.<br/>Once you save one, it\'ll appear here — and you\'ll get a slider once you have two or more.</div>';
      return;
    }
    const snap = snapshots[selectedIndex];
    const d = snap.data;
    const asOfDate = new Date(snap.asOf);
    asofLine.textContent = 'As of '+fmtDate(asOfDate)+'  ·  FY'+String(d.currentFY).slice(-2)+' to date (day '+d.elapsedDays+' of FY)  ·  '+fmtNum(d.rosterSize)+' donors in portfolio';

    let html = '';

    if(!d.schemaVersion || d.schemaVersion < SCHEMA_VERSION){
      html += '<div class="panel pdf-hide" style="border-left:4px solid var(--berry); background:#F5E3E1;">';
      html += '<div style="font-size:12.5px; color:var(--ink);"><strong>This snapshot was saved with an earlier version of the tool</strong> — some newer fields (like Fiscal Year Totals or Donor ID) may show as "—" here. Re-upload the same two files with the same "as of" date and hit Save Snapshot to refresh it.</div>';
      html += '</div>';
    }

    html += '<div class="pdf-hide" style="display:flex; justify-content:flex-end; margin-bottom:10px;"><button class="secondary" id="downloadPdfBtn">🖨 Print / Save as PDF</button></div>';

    // slider
    if(snapshots.length>1){
      html += '<div class="panel">';
      html += '<div class="slider-row"><input type="range" class="pdf-hide" id="periodSlider" min="0" max="'+(snapshots.length-1)+'" value="'+selectedIndex+'"/><span class="slider-label">'+fmtDate(asOfDate)+'</span></div>';
      html += '<div class="period-ticks">';
      snapshots.forEach((s,i)=>{ html += '<span>'+new Date(s.asOf).toLocaleDateString('en-US',{month:'short',year:'2-digit'})+'</span>'; });
      html += '</div>';
      // trend strip of total raised FYTD across snapshots
      const maxVal = Math.max(...snapshots.map(s=>s.data.totals.curFYTD), 1);
      html += '<div class="trend-strip">';
      snapshots.forEach((s,i)=>{
        const h = Math.max(2, Math.round((s.data.totals.curFYTD/maxVal)*44));
        html += '<div class="trend-bar '+(i===selectedIndex?'active':'')+'" style="height:'+h+'px" title="'+fmtDate(new Date(s.asOf))+': '+fmtMoneyFull(s.data.totals.curFYTD)+'"></div>';
      });
      html += '</div>';
      html += '<div class="footnote">Bars show Total Raised (FY-to-date) at each saved snapshot — a quick trend of pace across the year.</div>';
      html += '</div>';
    }

    // KPI grid
    html += '<div class="kpi-grid">';
    html += kpiCard('Total Raised (FYTD)', fmtMoney(d.totals.curFYTD), deltaSpan(d.totals.yoyPct), 'FY'+String(d.currentFY).slice(-2)+' vs. FY'+String(d.priorFY).slice(-2)+' same point');
    html += kpiCard('Active Donors (FYTD)', fmtNum(d.donors.activeCur), '<span class="delta flat">'+fmtPct(d.donors.participationRate)+' participation</span>', 'of '+fmtNum(d.rosterSize)+' in portfolio');
    html += kpiCard('Avg Gift Size', fmtMoneyFull(d.totals.avgGift), '<span class="delta flat">'+fmtNum(d.totals.giftsCurFYTD)+' gifts FYTD</span>', '');
    html += kpiCard('Donor LTV (avg)', fmtMoney(d.ltv.avg), '<span class="delta flat">median '+fmtMoney(d.ltv.median)+'</span>', 'all-time, across roster');
    html += kpiCard('Donor Retention Rate', fmtPct(d.donors.retentionRate), '<span class="delta flat">'+fmtNum(d.donors.retainedCount)+' of '+fmtNum(d.donors.activePriorFull)+' retained</span>', 'vs. full FY'+String(d.priorFY).slice(-2));
    html += kpiCard('Revenue Retention', fmtPct(d.donors.revenueRetention), '<span class="delta flat">of FY'+String(d.priorFY).slice(-2)+' total '+fmtMoneyFull(d.totals.priorFYFull)+'</span>', '$ from repeat donors');
    html += kpiCard('Donors Increased YoY', fmtNum(d.donors.increasedCount), '<span class="delta up">+'+fmtMoney(d.donors.increasedAmt)+' incremental</span>', 'gave more than same point last FY');
    html += kpiCard('Returning Donors', fmtNum(d.donors.reactivated), '<span class="delta flat">'+fmtNum(d.donors.newDonors)+' brand-new this FY</span>', 'gave again after skipping FY'+String(d.priorFY).slice(-2));
    html += '</div>';

    // fiscal year totals (two most recently completed FYs)
    html += '<div class="panel">';
    html += '<h2>Fiscal Year Totals</h2>';
    if(d.priorPriorFY){
      html += '<div class="kpi-grid" style="grid-template-columns:repeat(2,1fr);">';
      html += kpiCard('FY'+String(d.priorPriorFY).slice(-2)+' Total Raised', fmtMoneyFull(d.totals.priorPriorFYFull), '', 'Jul '+(d.priorPriorFY-1)+' – Jun '+d.priorPriorFY+' (complete)');
      html += kpiCard('FY'+String(d.priorFY).slice(-2)+' Total Raised', fmtMoneyFull(d.totals.priorFYFull), '', 'Jul '+(d.priorFY-1)+' – Jun '+d.priorFY+' (complete)');
      html += '</div>';
      html += '<div class="footnote">These are full, closed fiscal years (not to-date) — the two most recently completed relative to this snapshot\'s as-of date. They\'ll roll forward automatically each year (e.g. next year this becomes FY'+String(d.priorFY).slice(-2)+' and FY'+String(d.currentFY).slice(-2)+').</div>';
      if(d.fyCategoryBreakdown && d.fyCategoryBreakdown.length){
        html += '<div style="margin-top:14px;"><table><thead><tr><th>Fund Category</th><th class="num">FY'+String(d.priorPriorFY).slice(-2)+'</th><th class="num">FY'+String(d.priorFY).slice(-2)+'</th></tr></thead><tbody>';
        d.fyCategoryBreakdown.forEach(row=>{
          html += '<tr><td>'+row.category+'</td><td class="num">'+fmtMoneyFull(row.priorPrior)+'</td><td class="num">'+fmtMoneyFull(row.prior)+'</td></tr>';
        });
        html += '</tbody></table></div>';
      }
    } else {
      html += '<div class="footnote">Not available on this snapshot — re-save it to populate FY totals.</div>';
    }
    html += '</div>';

    // capacity gauge
    html += '<div class="panel">';
    html += '<h2>Portfolio Capacity vs. Actual</h2>';
    html += '<div class="gauge-wrap"><div class="gauge-bar"><div class="gauge-fill" style="width:'+Math.min(100,Math.round((d.capacity.pct||0)*100))+'%"></div></div><div class="gauge-pct">'+fmtPct(d.capacity.pct)+'</div></div>';
    html += '<div class="footnote">Capacity benchmark = each donor\'s higher of their current-FY or prior-FY total (‘demonstrated capacity’), summed across the portfolio: '+fmtMoneyFull(d.capacity.capacitySum)+'. Actual = FY-to-date giving: '+fmtMoneyFull(d.capacity.capacityActualSum)+'. This ratio will climb toward 100% as the fiscal year progresses — read it in context of day '+d.elapsedDays+' of the fiscal year.</div>';
    html += '</div>';

    // tables
    html += '<div class="two-col">';
    html += tableCard('Top 10 Donors (FYTD)', d.topDonors, [
      {h:'Donor', f:r=>r.name},
      {h:'Donor ID', f:r=>r.id||'—'},
      {h:'FYTD', f:r=>fmtMoneyFull(r.curFYTD), num:true},
      {h:'Same Pt Last FY', f:r=>fmtMoneyFull(r.priorFYTD), num:true},
      {h:'Gifts', f:r=>r.count, num:true}
    ]);
    html += '<div>';
    html += tableCard('Increased Giving YoY', d.increased, [
      {h:'Donor', f:r=>r.name},
      {h:'FYTD', f:r=>fmtMoneyFull(r.curFYTD), num:true},
      {h:'+ Increase', f:r=>'+'+fmtMoneyFull(r.inc), num:true, pillClass:'up'}
    ]);
    html += tableCard('Returning Donors', d.returning, [
      {h:'Donor', f:r=>r.name},
      {h:'FYTD', f:r=>fmtMoneyFull(r.curFYTD), num:true, pillClass:'back'}
    ]);
    html += '</div>';
    html += '</div>';

    area.innerHTML = html;

    if(snapshots.length>1){
      const slider = $('periodSlider');
      slider.addEventListener('input', (e)=>{
        selectedIndex = parseInt(e.target.value,10);
        renderDashboard();
      });
    }
    const pdfBtn = $('downloadPdfBtn');
    if(pdfBtn) pdfBtn.addEventListener('click', ()=> window.print());
  }

  function kpiCard(label, value, deltaHtml, sub){
    return '<div class="kpi"><div class="label">'+label+'</div><div class="value">'+value+'</div>'+deltaHtml+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
  }
  function tableCard(title, rows, cols){
    let html = '<div class="panel"><div class="section-title">'+title+'<span class="n">'+rows.length+'</span></div>';
    if(rows.length===0){
      html += '<div class="footnote">None this period.</div></div>';
      return html;
    }
    html += '<table><thead><tr><th class="rank">#</th>';
    cols.forEach(c=> html += '<th'+(c.num?' class="num"':'')+'>'+c.h+'</th>');
    html += '</tr></thead><tbody>';
    rows.forEach((r,i)=>{
      html += '<tr><td class="rank">'+(i+1)+'</td>';
      cols.forEach(c=>{
        const val = c.f(r);
        html += '<td'+(c.num?' class="num"':'')+'>'+val+'</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ---------- init ----------
  (async function init(){
    await loadPortfolios();
    renderPortfolioSelect();
    await switchPortfolio(portfolios[0].id);
  })();

})();
</script>
</body>
</html>
